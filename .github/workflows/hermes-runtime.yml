# 状态：草稿（M1A）。仅手动 dispatch 触发，不随 push 运行。
# 目标：在 arm64 runner 上产出 hermes-runtime.bin 并冒烟。
#
# 重要约束：本仓库 Actions 策略为 allowed_actions=local_only，
# 因此本 workflow 不能使用 actions/checkout、actions/upload-artifact 等官方 action，
# 取源码与上传产物都必须用普通命令完成，否则会在 startup 阶段直接失败。
name: hermes-runtime

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "把产物上传到本仓库 Release（需要 contents: write）"
        type: boolean
        default: false
      release_tag:
        description: "发布用的 tag（publish_release 为 true 时必填）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    # 必须 arm64 且 glibc 与目标 rootfs 同代（Ubuntu 24.04）
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 取源码（不使用官方 action）
        run: |
          set -euo pipefail
          curl -fsSL "${{ github.server_url }}/${{ github.repository }}/archive/${{ github.sha }}.tar.gz" \
            | tar -xz --strip-components=1
          test -f tools/build-hermes-runtime.py
          test -f tools/hermes-runtime/hermes.lock.json

      - name: 校验锁文件完整性
        run: python3 tools/build-hermes-runtime.py --check-lock

      - name: 导出锁文件版本到环境
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          lock = json.load(open("tools/hermes-runtime/hermes.lock.json", encoding="utf-8"))
          print("UV_VERSION=" + lock["buildTools"]["uv"])
          print("PNPM_VERSION=" + lock["buildTools"]["pnpm"])
          print("HERMES_COMMIT=" + lock["hermes"]["commit"])
          PY

      - name: 安装构建工具（固定版本）
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv --version

      - name: 组装运行时包
        run: |
          set -euo pipefail
          python3 tools/build-hermes-runtime.py \
            --output app/src/main/assets/hermes-runtime.bin \
            --stage app/build/hermes-runtime

      - name: 冒烟：解包到 /opt/hermes 并启动 dashboard
        run: |
          set -euo pipefail
          sudo mkdir -p /opt
          sudo ln -sfn "$PWD/app/build/hermes-runtime/opt/hermes" /opt/hermes
          test -f /opt/hermes/app/hermes_cli/tui_dist/entry.js || { echo "::error::缺少 TUI bundle，Chat 页会不可用"; exit 1; }
          HERMES_HOME="$RUNNER_TEMP/hermes-home" \
            /opt/hermes/hermes.sh dashboard --no-open --host 127.0.0.1 --port 19119 \
            > "$RUNNER_TEMP/dashboard.log" 2>&1 &
          PID=$!
          ok=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:19119/api/status" -o "$RUNNER_TEMP/status.json"; then ok=1; break; fi
            sleep 1
            kill -0 $PID 2>/dev/null || break
          done
          if [ "$ok" != 1 ]; then
            echo "::error::dashboard 未在 120 秒内就绪"
            tail -n 80 "$RUNNER_TEMP/dashboard.log" || true
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          status = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "status.json"), encoding="utf-8"))
          assert status.get("auth_required") in (False, None), status.get("auth_required")
          print("auth_required:", status.get("auth_required"))
          PY
          # U2 验证：预构建 web_dist 生效时不应触发前端构建
          if grep -qiE 'pnpm|vite build|building frontend' "$RUNNER_TEMP/dashboard.log"; then
            echo "::error::启动过程触发了前端构建，说明 HERMES_WEB_DIST 未被采用"
            tail -n 80 "$RUNNER_TEMP/dashboard.log"
            exit 1
          fi
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true

      - name: 校验产物身份
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          archive = pathlib.Path("app/src/main/assets/hermes-runtime.bin")
          inputs = json.loads(archive.with_suffix(".inputs.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == inputs["archive_sha256"], "归档摘要与 inputs.json 不一致"
          print(json.dumps({k: inputs[k] for k in ("version", "hermesCommit", "files",
                                                   "unpacked_bytes", "archive_bytes")}, indent=2))
          PY

      - name: 写入运行摘要
        run: |
          {
            echo "### hermes-runtime 产物身份"
            echo '```json'
            cat app/src/main/assets/hermes-runtime.inputs.json
            echo '```'
            ls -l app/src/main/assets/hermes-runtime.bin
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 Release（可选）
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "$TAG" || { echo "::error::release_tag 为空"; exit 1; }
          # 源码是 tarball 解出来的，没有 .git；gh 必须显式指定仓库。
          REPO="${{ github.repository }}"
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "hermes-runtime $TAG" --notes "Hermes 运行时固定输入（由 CI 构建）"
          gh release upload "$TAG" --repo "$REPO" \
            app/src/main/assets/hermes-runtime.bin \
            app/src/main/assets/hermes-runtime.inputs.json --clobber
